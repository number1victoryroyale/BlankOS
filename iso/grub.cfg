# BlankOS live boot menu. @PALETTE@, @EXTRA@, @INITRD@ and @TIMEOUT@ are
# filled in by iso/mkiso.sh. Same file for BIOS (El Torito) and UEFI boots.
set default=0
set timeout=@TIMEOUT@
insmod all_video
insmod iso9660
search --no-floppy --set=root --label @LABEL@

# Violet on near-black (VGA text palette: magenta is the closest to the
# BlankOS accent until the graphical GRUB theme lands).
set color_normal=light-gray/black
set color_highlight=white/magenta
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta

# BlankOS theme (fonts and pictures on the ISO); the text menu above is
# the fallback when it is missing or the firmware has no graphics mode
set themedir=/boot/grub/themes/blankos
if [ -f $themedir/theme.txt ]; then
	insmod gfxterm
	insmod gfxmenu
	insmod png
	loadfont $themedir/noto_sans_regular_16.pf2
	loadfont $themedir/noto_sans_regular_20.pf2
	loadfont $themedir/noto_sans_bold_48.pf2
	loadfont $themedir/noto_sans_mono_regular_16.pf2
	set gfxmode=1920x1080,1280x720,auto
	terminal_output gfxterm
	set theme=$themedir/theme.txt
fi

set live="blankos.live blankos.live.label=@LABEL@ @PALETTE@"
# GPU drivers: the open ones (nouveau for NVIDIA cards) unless the NVIDIA
# entry is chosen; the installer keeps the choice
set opengpu="modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem"
set nvidiagpu="modprobe.blacklist=nouveau nvidia_drm.modeset=1"

menuentry "BlankOS live" --class blankos {
	linux /boot/vmlinuz-linux $live $opengpu quiet loglevel=3 @EXTRA@
	initrd @INITRD@
}

menuentry "BlankOS live (NVIDIA, GTX 16 / RTX and newer)" --class blankos {
	linux /boot/vmlinuz-linux $live $nvidiagpu quiet loglevel=3 @EXTRA@
	initrd @INITRD@
}

menuentry "BlankOS live (safe graphics)" --class blankos {
	linux /boot/vmlinuz-linux $live $opengpu nomodeset @EXTRA@
	initrd @INITRD@
}

menuentry "BlankOS live (copy to RAM)" --class blankos {
	linux /boot/vmlinuz-linux $live $opengpu blankos.copytoram quiet loglevel=3 @EXTRA@
	initrd @INITRD@
}

if [ "$grub_platform" = "efi" ]; then
	menuentry "UEFI firmware settings" {
		fwsetup
	}
fi

menuentry "Reboot" {
	reboot
}

menuentry "Power off" {
	halt
}
