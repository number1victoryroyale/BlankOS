# BlankOS cloud build: toolchain -> [core] (chained passes) -> disk image
# -> QEMU boot test. Packages are published to GitHub Releases, so every
# run only rebuilds what changed.
name: BlankOS build

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blankos-build-${{ github.ref }}
  cancel-in-progress: false

env:
  LFS: /mnt/blankos
  SRC: /mnt/sources
  OUT: /mnt/out
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning toolchain/*.sh tools/*.sh image/*.sh tests/*.sh
      - name: PKGBUILD syntax
        run: for f in pkgs/*/*/PKGBUILD; do bash -n "$f" || exit 1; done

  toolchain:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the published builder if the toolchain is unchanged
        id: have
        run: |
          mkdir -p "$OUT" || sudo mkdir -p "$OUT"
          sudo chown "$USER" "$OUT"
          if tools/ci-release.sh fetch-builder; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare host
        if: steps.have.outputs.hit != 'true'
        run: |
          sudo mkdir -p "$SRC"
          sudo chown "$USER" "$SRC"
          sudo toolchain/host-prep.sh

      - uses: actions/cache@v4
        if: steps.have.outputs.hit != 'true'
        with:
          path: /mnt/sources
          key: sources-${{ hashFiles('toolchain/lfs-*/*', 'toolchain/extra-sources.txt', 'pkgs/**/PKGBUILD') }}
          restore-keys: sources-

      - name: Build LFS toolchain + pacman bootstrap
        if: steps.have.outputs.hit != 'true'
        run: sudo --preserve-env=LFS,SRC,OUT toolchain/build-toolchain.sh

      - name: Publish builder
        if: steps.have.outputs.hit != 'true' && github.event_name != 'pull_request'
        run: tools/ci-release.sh publish-builder

      - name: Upload toolchain logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-toolchain
          path: /mnt/blankos/build/logs
          retention-days: 14

  core-1:
    needs: toolchain
    uses: ./.github/workflows/repo-stage.yml
    with: { repo: core, pass: "1" }
  core-2:
    needs: core-1
    uses: ./.github/workflows/repo-stage.yml
    with: { repo: core, pass: "2" }
  core-3:
    needs: core-2
    uses: ./.github/workflows/repo-stage.yml
    with: { repo: core, pass: "3", final: true }

  image:
    needs: core-3
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare host
        run: |
          sudo mkdir -p "$SRC" "$OUT"
          sudo chown "$USER" "$SRC" "$OUT"
          sudo toolchain/host-prep.sh
          # let QEMU use KVM
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore builder and [core]
        run: |
          tools/ci-release.sh fetch-builder
          sudo mkdir -p "$LFS"
          sudo tar --zstd -xpf "$OUT/builder-rootfs.tar.zst" -C "$LFS"
          rm "$OUT/builder-rootfs.tar.zst"
          tools/ci-release.sh fetch-repo core
          # installs the (already built) packages into the builder
          sudo --preserve-env=LFS,SRC,OUT tools/build-repo.sh core

      - name: Build test disk image
        run: sudo --preserve-env=LFS,SRC,OUT image/mkimage.sh --test

      - name: Boot test (QEMU, UEFI)
        run: sudo python3 tests/boot-test.py "$OUT/image/blankos.img" --log "$OUT/boot-test.log" --timeout 1500

      - name: Compress image
        if: always()
        run: |
          if [ -f "$OUT/image/blankos.img" ]; then
            sudo qemu-img convert -c -O qcow2 "$OUT/image/blankos.img" "$OUT/blankos-test.qcow2"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: |
            /mnt/out/boot-test.log
            /mnt/out/blankos-test.qcow2
          if-no-files-found: ignore
          retention-days: 7
