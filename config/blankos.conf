# BlankOS build configuration. Sourced by every build script.
# Anything here can be overridden from the environment.

BLANKOS_NAME="BlankOS"
BLANKOS_VERSION="${BLANKOS_VERSION:-0.1.0}"
LFS_BOOK="13.1"                      # LFS stable-systemd book we follow
KERNEL_VERSION="7.3"                  # latest stable at time of writing

ARCH="x86_64"
LFS_TGT="${ARCH}-lfs-linux-gnu"

# Repo root (directory containing this config/ dir).
BLANKOS_ROOT="${BLANKOS_ROOT:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"

# Where the builder root filesystem lives while building.
LFS="${LFS:-/mnt/blankos}"
# Downloaded source tarballs (cache, never committed).
SRC="${SRC:-$BLANKOS_ROOT/sources}"
# Build outputs: builder tarball, pacman repos, images.
OUT="${OUT:-$BLANKOS_ROOT/out}"
REPO_OUT="${REPO_OUT:-$OUT/repo}"

JOBS="${JOBS:-$(nproc)}"
