# pacman.conf used inside the builder chroot. Packages are installed with
# `pacman -U` straight from the build output, so no repos are configured.
[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
HookDir     = /etc/pacman.d/hooks/
Architecture = x86_64
# The builder disk is a scratch filesystem; don't let pacman guess at it.
#CheckSpace
SigLevel = Never
LocalFileSigLevel = Never
