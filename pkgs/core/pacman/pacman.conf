# /etc/pacman.conf -- BlankOS
# See pacman.conf(5) for details.

[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
ILoveCandy

# TODO(BlankOS): packages are not signed yet (pacman is built without
# gpgme until the GnuPG stack lands in [extra]). Do not change this to
# Required until blankos-keyring exists.
SigLevel          = Never
LocalFileSigLevel = Never

[core]
Include = /etc/pacman.d/mirrorlist

#[extra]
#Include = /etc/pacman.d/mirrorlist

#[desktop]
#Include = /etc/pacman.d/mirrorlist

#[gaming]
#Include = /etc/pacman.d/mirrorlist
