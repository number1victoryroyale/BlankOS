# /etc/pacman.conf -- BlankOS
# See pacman.conf(5) for details.

[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
ILoveCandy

# TODO(BlankOS): pacman can verify signatures (it is built with gpgme),
# but the packages are not signed yet. Do not change this to Required
# until the blankos-keyring package exists.
SigLevel          = Never
LocalFileSigLevel = Never

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[desktop]
#Include = /etc/pacman.d/mirrorlist

#[gaming]
#Include = /etc/pacman.d/mirrorlist
