# BlankOS gaming-oriented kernel defaults.
# Many games (and Proton/Wine) need far more memory mappings than the default.
vm.max_map_count = 2147483642
# Low-latency TCP congestion control for online games.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Don't let the kernel stall foreground apps for swapping as eagerly.
vm.swappiness = 20
