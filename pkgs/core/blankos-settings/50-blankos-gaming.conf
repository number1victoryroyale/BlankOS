# BlankOS gaming-oriented kernel defaults.
# Many games (and Proton/Wine) need far more memory mappings than the default.
vm.max_map_count = 2147483642
# Low-latency TCP congestion control for online games.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Swap goes to zram (compressed RAM, see blankos-zram.service), which is far
# cheaper than dropping page cache, so prefer it; read swap one page at a time.
vm.swappiness = 180
vm.page-cluster = 0
