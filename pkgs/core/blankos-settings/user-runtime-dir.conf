# The user manager (systemd --user) expects $XDG_RUNTIME_DIR, which
# pam_systemd normally provides. BlankOS has no PAM yet (milestone 4), so
# set it here; without it user@.service fails and no user services (sound)
# can start. Remove once systemd is built with PAM.
[Service]
# %i is the UID (%U would be the service manager's own UID, 0)
Environment=XDG_RUNTIME_DIR=/run/user/%i
