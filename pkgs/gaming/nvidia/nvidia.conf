# BlankOS: NVIDIA driver options
# Wayland (KWin) needs kernel modesetting and the DRM framebuffer device
options nvidia_drm modeset=1 fbdev=1
# keep video memory across suspend (nvidia-suspend/resume services), and
# let laptop GPUs power down when idle (RTD3, Turing and newer)
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_DynamicPowerManagement=0x02
