# Remove what only the live system needs
---
dontChroot: false
timeout: 300
script:
    - "-userdel -r live"
    - "rm -f /var/lib/systemd/linger/live /etc/sddm.conf.d/50-live.conf /etc/polkit-1/rules.d/49-live.rules"
    - "rm -rf /etc/systemd/system/getty@tty1.service.d"
    - "-pacman -Rdd --noconfirm blankos-installer calamares"
