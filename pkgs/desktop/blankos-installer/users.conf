---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - audio
    - video
    - render
    - input
    - gamemode
autologinGroup: autologin
doAutologin: false
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "blankos-${cpu}"
