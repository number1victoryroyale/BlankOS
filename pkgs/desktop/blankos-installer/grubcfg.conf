---
overwrite: false
keepDistributor: false
prefer_grub_d: false
always_use_defaults: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    GRUB_THEME: "/usr/share/grub/themes/blankos/theme.txt"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet loglevel=3"
    GRUB_DISABLE_OS_PROBER: false
