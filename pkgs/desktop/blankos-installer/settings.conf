# BlankOS installer: copy the live system to disk, then make it a normal
# installed system (users, boot loader, initramfs, no live-only bits).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
- id: initramfs
  module: shellprocess
  config: shellprocess-initramfs.conf
- id: palette
  module: shellprocess
  config: shellprocess-palette.conf
- id: gpu
  module: shellprocess
  config: shellprocess-gpu.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - shellprocess@cleanup
  - shellprocess@gpu
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@initramfs
  - grubcfg
  - shellprocess@palette
  - bootloader
  - umount
- show:
  - finished

branding: blankos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
